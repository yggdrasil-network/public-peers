name: Parse Markdown Files

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parse-peers
  cancel-in-progress: true

env:
  ARTIFACT_BRANCH: data/nodes

jobs:
  parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parser
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import re

          PATTERN = r'`((tcp|tls|quic|ws|wss)://([a-z0-9\.\-:\[\]]+(:[0-9]+)?(\?[^\s]*)?))`'
          nodes = {}

          for root, dirs, files in os.walk('.'):
              # Sort so the output does not depend on filesystem ordering
              dirs[:] = sorted(d for d in dirs if not d.startswith('.'))
              if root == '.':
                  # README.md documents the URI format, it is not peer data
                  continue
              category = os.path.basename(root)
              for filename in sorted(files):
                  if not filename.endswith('.md'):
                      continue
                  path = os.path.join(root, filename)
                  with open(path, encoding='utf-8') as handle:
                      addresses = [match[0] for match in re.findall(PATTERN, handle.read())]
                  if addresses:
                      subcategory = os.path.splitext(filename)[0]
                      nodes.setdefault(category, {})[subcategory] = addresses

          with open('nodes.json', 'w', encoding='utf-8') as handle:
              json.dump(nodes, handle, ensure_ascii=False, indent=4)

          with open('nodes.csv', 'w', newline='', encoding='utf-8') as handle:
              # Use LF everywhere so the output is byte-identical on any platform.
              writer = csv.writer(handle, lineterminator='\n')
              writer.writerow(["Category", "Subcategory", "URI"])
              for category, subcategories in nodes.items():
                  for subcategory, addresses in subcategories.items():
                      for address in addresses:
                          writer.writerow([category, subcategory, address])
          PY


      - name: Publish artifacts to ${{ env.ARTIFACT_BRANCH }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Skip publishing when the generated files are identical to the branch.
          if git fetch --depth=1 --no-tags origin \
               "+refs/heads/$ARTIFACT_BRANCH:refs/remotes/origin/$ARTIFACT_BRANCH" 2>/dev/null; then
            remote_ref="refs/remotes/origin/$ARTIFACT_BRANCH"
            if [ "$(git rev-parse --verify -q "$remote_ref:nodes.json" || true)" = "$(git hash-object nodes.json)" ] &&
               [ "$(git rev-parse --verify -q "$remote_ref:nodes.csv" || true)" = "$(git hash-object nodes.csv)" ]; then
              echo "Artifacts are unchanged, nothing to publish."
              exit 0
            fi
          fi

          # Build a single-commit snapshot containing only the artifacts.
          git checkout --orphan nodes-snapshot
          git rm -r --cached -f . >/dev/null
          git add nodes.csv nodes.json
          git commit -m "chore(nodes): regenerate nodes.csv and nodes.json"
          git push --force origin "HEAD:refs/heads/$ARTIFACT_BRANCH"
